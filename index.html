<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <title>Fetch crud 1 with generic</title>

        .spinner{position:fixed;
        inset:0;
        left:0;
        top:0;
        width:100%;
        height:100vh;
        background-color:rgb(255,  255, 255, .8);
        display:flex;
        justify-content:center;

   <body>
    <header class="text-center text-white bg-dark">
        <h1>Railway Reservation</h1>
    </header>
    <div class="bg-image"></div>
   <div class="container mt-5">
    <div class="row">
                <div class="col-md-4">

        <div class="card my-form">
            <div class="card-header">
                <h4 class="m-0 text-center"><i class="fa-solid fa-train"></i>Railway ticket</h4>
            </div>
            <div class="card-body">
            <form class="form" id="form">
                <div class="form-group">
                    <label for="name">Passangers Name</label>
                    <input required type="text" class="form-control" id="PassangersName">
                </div>
                <div class="form-group">
                    <label for="Name">Journey Type:</label>
                    <select  class="form-control" id="JourneyType">
                        <option value="">Select Option</option>
                        <option value="Oneway">Oneway</option>
                        <option value="Return">Return</option>
                </select>
                </div>
                <div class="form-group">
                    <label for="NumberofPassanger">Number of Passangers</label>
                    <input required type="number" class="form-control" id="NumberofPassanger">
                </div>
                <div class="form-group">
                    <label for="From">From:</label>
                    <select  class="form-control" id="from">
                        <option value="">Select Option</option>
                        <option value="Pune">Pune</option>
                        <option value="ShivajiNagar">Shivaji Nagar</option>
                        <option value="Daund">Daund</option>
                </select>
                </div>
                <div class="form-group">
                    <label for="To">TO:</label>
                    <select  class="form-control" id="To">
                        <option value="">Select Option</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Dadar">Dadar</option>
                        <option value="Lonavala">Lonavala</option>
                </select>
                </div>
                <div class="form-group">
                    <label for="Age">Age</label>
                    <input type="number" class="form-control" id="Age">
                </div>
                <div class="payment-group">
                    <label for="upi">Payment Option:</label>
                    <div class="options-container">
                    <input type="radio" name="payment" id="upi" value="UPI">
                    <label for="UPI"><i class="fa-brands fa-amazon-pay"></i>UPI</label>

                    <input type="radio" name="payment" id="Netbanking" value="Netbanking">
                    <label for="Netbanking"><i class="fa-solid fa-money-bill-trend-up"></i>Netbanking</label><br>

                    <input type="radio" name="payment" id="Cash" value="Cash">
                    <label for="Cash"><i class="fa-solid fa-sack-dollar"></i>Cash</label>

                    <input type="radio" name="payment" id="Card" value="Card">
                    <label for="Card"><i class="fa-regular fa-credit-card"></i>Debit/Credit Card</label>
                    
                    </div>
                    
                    
                </div>
           
           
                <button type="submit" class="btn btn-sm btn-block btn-dark" id="SubmitBtn">Submit</button>
                <button type="button" class="btn btn-sm btn-block btn-primary d-none" id="UpdateBtn">Update</button>

           
            </form>
        </div>
        </div>
        </div>
        <div class="col-md-8">
        <table class="table table-bordered  text-white  text-center">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Journey Type</th>
                    <th>Count</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Age</th>
                    <th>Payment By</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody id="passangersdata">
                <!-- <tr>
                    
                    <td>1</td>
                    <td>Pratik</td>
                    <td>Oneway</td>
                    <td>3</td>
                    <td>pune</td>
                    <td>Mumbai</td>
                    <td>33</td>
                    <td>Cash</td>



                    <td><i class="fa-solid fa-pen-to-square fa-2x text-primary"></i></td>
                    <td><i class="fa-solid fa-trash-can fa-2x text-danger"></i></td>
                    
                </tr>
                  -->
            </tbody>
        </table>

        </div>
    </div>

   </div>
   <div class="spinner d-none" id="spinner">
    <div class="spinner-border" role="status">
  <span class="sr-only">Loading...</span>
</div>
   </div>


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
